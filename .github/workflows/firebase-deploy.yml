name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create firebase.json config
        run: |
          if [ ! -f firebase.json ]; then
            echo '{"hosting": {"public": "."}}' > firebase.json
          fi

      - name: Generate Service Account File via Node.js
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = process.env.FIREBASE_KEY_JSON;
            const parsed = JSON.parse(raw);
            fs.writeFileSync("service-account.json", JSON.stringify(parsed, null, 2));
          '

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          npx firebase-tools deploy --only hosting --project syriacash-app --non-interactive
