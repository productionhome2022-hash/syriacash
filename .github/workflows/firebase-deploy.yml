name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create firebase.json config
        run: |
          if [ ! -f firebase.json ]; then
            echo '{"hosting": {"public": "."}}' > firebase.json
          fi

      - name: Create Service Account File
        run: |
          cat << 'EOF' > service-account.json
          ${{ secrets.FIREBASE_TOKEN }}
          EOF

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          npx firebase-tools deploy --only hosting --project syriacash-app --non-interactive
